<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCEE - Eletrônicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #000; /* Preto estilo referência */
            --accent-color: #ff6600; /* Laranja destaque */
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .navbar { background-color: var(--primary-color); padding: 15px 0; }
        .navbar-brand { color: white !important; font-weight: bold; letter-spacing: 1px; }
        .search-bar { border-radius: 20px 0 0 20px; border: none; }
        .btn-search { border-radius: 0 20px 20px 0; background-color: var(--accent-color); color: white; border: none; }
        .nav-icon { color: white; margin-left: 15px; font-size: 1.2rem; text-decoration: none; }
        .footer { background-color: #222; color: #aaa; padding: 40px 0; margin-top: 50px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">SCEE STORE</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon bg-white rounded"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto w-50">
                    <input class="form-control search-bar" type="search" placeholder="O que você procura hoje?" aria-label="Search">
                    <button class="btn btn-search" type="submit"><i class="fas fa-search"></i></button>
                </form>

                <div class="d-flex align-items-center mt-3 mt-lg-0">
                    <a href="#" class="nav-icon"><i class="far fa-user"></i> <span class="d-none d-lg-inline fs-6 ms-1">Entrar</span></a>
                    <a href="/carrinho" class="nav-icon position-relative">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
                            {{ session['carrinho']|length if session.get('carrinho') else 0 }}
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <div class="container text-center">
            <p>© 2025 SCEE - Sistema de Comércio Eletrônico de Eletrônicos.</p>
            <small>Projeto desenvolvido em Python e SQLite.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
