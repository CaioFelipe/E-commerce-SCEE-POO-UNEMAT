<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCEE - Eletrônicos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="brand">
            <h1><i class="fas fa-microchip"></i> SCEE Store</h1>
        </div>
        <nav>
            <span id="user-display" class="hidden" style="margin-right: 15px; font-size: 0.9rem; color: var(--text-secondary);"></span>
            <button id="btn-login" onclick="toggleLogin()"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <button id="btn-profile" class="hidden" onclick="toggleProfile()"><i class="fas fa-user-circle"></i> Meu Perfil</button>
            <button id="btn-cart" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i> Carrinho (<span id="cart-count">0</span>)</button>
            <button id="btn-logout" class="hidden" onclick="logout()" style="color: var(--danger-color);"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </nav>
    </header>

    <main class="container">
        <!-- BARRA DE FILTROS (ATUALIZADA) -->
        <div class="filters-bar" style="background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
            <h4 style="margin: 0; color: var(--accent-color);"><i class="fas fa-filter"></i> Filtros:</h4>
            
            <!-- NOVO: Select de Categoria -->
            <select id="filter-categoria" style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2d2d2d; color: white;">
                <option value="">Todas as Categorias</option>
                <!-- Opções carregadas via JS -->
            </select>

            <div style="display: flex; gap: 5px; align-items: center;">
                <input type="number" id="filter-min" placeholder="Min R$" style="width: 80px; padding: 8px;">
                <span style="color: #fff;">até</span>
                <input type="number" id="filter-max" placeholder="Max R$" style="width: 80px; padding: 8px;">
            </div>

            <input type="text" id="filter-busca" placeholder="Buscar por nome..." style="width: 200px; padding: 8px;">

            <button class="btn-add" onclick="aplicarFiltros()" style="width: auto; margin: 0; padding: 8px 15px;">Aplicar</button>
            <button onclick="limparFiltros()" style="background: none; border: 1px solid #444; color: #aaa; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Limpar</button>
        </div>

        <div id="product-list" class="product-grid">
            <p style="grid-column: 1/-1; text-align: center;">Carregando catálogo...</p>
        </div>
    </main>

    <!-- MODAIS (Login, Cadastro, Carrinho mantêm-se) -->
    <!-- [MODAL LOGIN - Igual ao anterior] -->
    <div id="modal-login" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleLogin()">&times;</button>
            <h2>Acessar Conta</h2>
            <div class="form-group"><label>E-mail</label><input type="email" id="login-email"></div>
            <div class="form-group"><label>Senha</label><input type="password" id="login-pass"></div>
            <button class="btn-add" onclick="fazerLogin()">Entrar</button>
            <p id="login-error" style="color: var(--danger-color); margin-top: 10px; text-align: center;"></p>
            <div style="margin-top: 15px; text-align: center;"><a href="#" onclick="alternarParaCadastro()" style="color: var(--accent-color);">Cadastre-se grátis</a></div>
        </div>
    </div>

    <!-- [MODAL CADASTRO - Igual ao anterior] -->
    <div id="modal-cadastro" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleCadastro()">&times;</button>
            <h2>Criar Conta</h2>
            <div class="form-group"><label>Nome</label><input type="text" id="cad-nome"></div>
            <div class="form-group"><label>CPF</label><input type="text" id="cad-cpf"></div>
            <div class="form-group"><label>E-mail</label><input type="email" id="cad-email"></div>
            <div class="form-group"><label>Senha</label><input type="password" id="cad-senha"></div>
            <div class="form-group"><label>Confirmar</label><input type="password" id="cad-senha-conf"></div>
            <button class="btn-add" onclick="fazerCadastro()">Cadastrar</button>
            <p id="cad-error" style="color: var(--danger-color); margin-top: 10px; text-align: center;"></p>
            <div style="margin-top: 15px; text-align: center;"><a href="#" onclick="alternarParaLogin()" style="color: var(--accent-color);">Faça Login</a></div>
        </div>
    </div>

    <!-- [MODAL PERFIL - ATUALIZADO COM BOTÃO DE PEDIDOS] -->
    <div id="modal-profile" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleProfile()">&times;</button>
            <h2>Meu Perfil</h2>
            <div class="form-group"><label>CPF</label><input type="text" id="perf-cpf" disabled style="background: #333; color: #888;"></div>
            <div class="form-group"><label>Nome</label><input type="text" id="perf-nome"></div>
            <div class="form-group"><label>E-mail</label><input type="email" id="perf-email"></div>
            
            <button class="btn-add" onclick="salvarPerfil()">Salvar Alterações</button>
            
            <hr style="border-color: #444; margin: 20px 0;">
            
            <button class="btn-add" onclick="abrirMeusPedidos()" style="background-color: #444; border: 1px solid #666;">
                <i class="fas fa-box-open"></i> Ver Meus Pedidos
            </button>
        </div>
    </div>

    <!-- [NOVO MODAL: MEUS PEDIDOS] -->
    <div id="modal-pedidos" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 700px; max-height: 80vh; overflow-y: auto;">
            <button class="close-btn" onclick="togglePedidos()">&times;</button>
            <h2><i class="fas fa-history"></i> Histórico de Pedidos</h2>
            <div id="lista-pedidos-container" style="margin-top: 20px;">
                <!-- Pedidos carregados via JS -->
            </div>
        </div>
    </div>

    <!-- [MODAL CARRINHO - Igual ao anterior] -->
    <div id="modal-cart" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-btn" onclick="toggleCart()">&times;</button>
            <h2>Seu Carrinho</h2>
            <div id="cart-items" style="max-height: 200px; overflow-y: auto; border-bottom: 1px solid #444;"></div>
            <div style="display: flex; justify-content: space-between; margin: 15px 0;">
                <span>Total:</span><span style="font-weight: bold; color: var(--success-color);">R$ <span id="cart-total">0.00</span></span>
            </div>
            
            <div id="checkout-area" class="hidden">
                <hr style="border-color: #444; margin: 10px 0;">
                <h4>Endereço de Entrega</h4>
                <div style="display: grid; grid-template-columns: 3fr 1fr; gap: 10px;">
                    <input type="text" id="end-rua" placeholder="Rua" required>
                    <input type="number" id="end-num" placeholder="Nº" required>
                </div>
                <input type="text" id="end-bairro" placeholder="Bairro" required style="margin-bottom: 10px;">
                
                <h4>Pagamento</h4>
                <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                    <label><input type="radio" name="pagamento" value="pix" checked onchange="togglePagamento()"> PIX</label>
                    <label><input type="radio" name="pagamento" value="cartao" onchange="togglePagamento()"> Cartão</label>
                </div>
                <div id="div-cartao" class="hidden"><input type="text" id="pag-cartao-num" placeholder="Número do Cartão"></div>
                
                <button class="btn-add" style="background-color: var(--success-color); color: #000; margin-top: 10px;" onclick="finalizarCompra()">FINALIZAR PEDIDO</button>
            </div>
            <button id="btn-checkout-start" class="btn-add" onclick="iniciarCheckout()">Ir para Pagamento</button>
        </div>
    </div>

    <script src="js/api_client.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
